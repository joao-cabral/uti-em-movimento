name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

env:
  APP_DIR: /home/deploy/apps/uti-em-movimento
  CONTAINER_NAME: uti-em-movimento-web
  DOMAIN: uti-em-movimento.larbac.me
  CASA_SEGURA_CONTAINER_NAME: casa-segura-web
  CASA_SEGURA_DOMAIN: casa-segura.larbac.me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: npm ci && npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H 151.247.210.165 >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          ssh deploy@151.247.210.165 "mkdir -p '$APP_DIR/releases/$GITHUB_SHA'"
          rsync -az --delete dist/ "deploy@151.247.210.165:$APP_DIR/releases/$GITHUB_SHA/dist/"
          rsync -az \
            deploy/nginx.conf \
            deploy/nginx-casa-segura.conf \
            "deploy@151.247.210.165:$APP_DIR/"

      - name: Activate release
        run: |
          ssh deploy@151.247.210.165 "APP_DIR='$APP_DIR' RELEASE='$APP_DIR/releases/$GITHUB_SHA' CONTAINER_NAME='$CONTAINER_NAME' DOMAIN='$DOMAIN' CASA_SEGURA_CONTAINER_NAME='$CASA_SEGURA_CONTAINER_NAME' CASA_SEGURA_DOMAIN='$CASA_SEGURA_DOMAIN' bash -se" <<'EOF'
          set -euo pipefail
          app_dir="$APP_DIR"
          release="$RELEASE"
          container="$CONTAINER_NAME"
          domain="$DOMAIN"
          casa_container="$CASA_SEGURA_CONTAINER_NAME"
          casa_domain="$CASA_SEGURA_DOMAIN"

          ln -sfn "$release" "$app_dir/current"
          docker rm -f "$container" 2>/dev/null || true
          docker run -d \
            --name "$container" \
            --restart unless-stopped \
            --network kamal \
            -v "$app_dir/current/dist:/usr/share/nginx/html:ro" \
            -v "$app_dir/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine
          docker exec kamal-proxy kamal-proxy deploy "$container" \
            --host "$domain" \
            --target "$container:80" \
            --tls

          docker rm -f "$casa_container" 2>/dev/null || true
          docker run -d \
            --name "$casa_container" \
            --restart unless-stopped \
            --network kamal \
            -v "$app_dir/current/dist:/usr/share/nginx/html:ro" \
            -v "$app_dir/nginx-casa-segura.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine
          docker exec kamal-proxy kamal-proxy deploy "$casa_container" \
            --host "$casa_domain" \
            --target "$casa_container:80" \
            --tls

          docker image prune -f >/dev/null
          EOF
